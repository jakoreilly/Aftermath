<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aftermath icon">
  <title>Aftermath</title>
  <desc>Scattered evidence — a git commit, a log line, a deploy, an inference — converging into one timeline, with the incident itself ringed.</desc>
  <defs>
    <linearGradient id="markIcon" x1="18" y1="0" x2="82" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="55%" stop-color="#ef6461"/>
      <stop offset="100%" stop-color="#8b7cf0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0d1117"/>
  <rect x="4" y="4" width="92" height="92" rx="18" fill="#11161d" stroke="#21262d" stroke-width="2"/>

  <!-- glow: wide, faint duplicate strokes (no SVG filter — rasterisers mangle those) -->
  <g opacity="0.16">
    <path d="M22,40 Q34,52 46,63 Q58,54 70,46 Q78,50 82,50" fill="none" stroke="url(#markIcon)" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="82" cy="50" r="14" fill="none" stroke="#f5a623" stroke-width="4"/>
  </g>

  <!-- crisp mark -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="#8b949e" stroke-width="1.3" opacity="0.35" stroke-linecap="round"/>
  <path d="M22,40 Q34,52 46,63 Q58,54 70,46 Q78,50 82,50" fill="none" stroke="url(#markIcon)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="22" cy="40" r="4.2" fill="#e6edf3"/>
  <circle cx="46" cy="63" r="3.8" fill="#e6edf3"/>
  <circle cx="70" cy="46" r="4.2" fill="#11161d" stroke="#e6edf3" stroke-width="1.4"/>
  <circle cx="82" cy="50" r="4.2" fill="#e6edf3"/>
  <circle cx="82" cy="50" r="8.5" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.9"/>
</svg>
