<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aftermath — a provenance-labelled incident timeline">
  <title>Aftermath</title>
  <desc>Scattered evidence — a git commit, a log line, a deploy, an inference — converging into one timeline, with the incident itself ringed.</desc>
  <defs>
    <linearGradient id="mark" x1="20" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="55%" stop-color="#ef6461"/>
      <stop offset="100%" stop-color="#8b7cf0"/>
    </linearGradient>
    <linearGradient id="word" x1="285" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffc373"/>
      <stop offset="55%" stop-color="#ff9a90"/>
      <stop offset="100%" stop-color="#b3a4ff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="198" rx="18" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- mark: evidence scattered on the left settles onto one flat line by the incident node -->
  <g transform="translate(40,35) scale(1.3)">
    <line x1="10" y1="50" x2="150" y2="50" stroke="#8b949e" stroke-width="1.3" opacity="0.35" stroke-linecap="round"/>
    <path d="M20,35 Q34,50 48,65 Q62,55 76,45 Q90,50 104,58 Q120,54 138,50"
          fill="none" stroke="url(#mark)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="20" cy="35" r="5" fill="#e6edf3"/>
    <circle cx="48" cy="65" r="4.5" fill="#e6edf3"/>
    <circle cx="76" cy="45" r="5" fill="#0d1117" stroke="#e6edf3" stroke-width="1.6"/>
    <circle cx="104" cy="58" r="3.5" fill="#e6edf3" opacity="0.45"/>
    <circle cx="138" cy="50" r="5" fill="#e6edf3"/>
    <circle cx="138" cy="50" r="10" fill="none" stroke="#f5a623" stroke-width="1.6" opacity="0.9"/>
  </g>

  <text x="285" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="56" fill="url(#word)">Aftermath</text>
  <text x="287" y="140" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace" font-size="17" fill="#8b949e">a provenance-labelled incident timeline</text>
</svg>
