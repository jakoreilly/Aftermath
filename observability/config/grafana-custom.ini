[paths]
data = ../data/grafana
logs = ../data/grafana/log
plugins = ../data/grafana/plugins

[server]
http_port = 3000

[security]
# Local dev-only instance, never exposed beyond 127.0.0.1 - default creds are
# fine here and simpler than generating and tracking a real one.
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = false
