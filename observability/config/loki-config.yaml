---
# Single-node, filesystem-backed Loki for local log aggregation of Aftermath's
# MCP-server logs. No S3/GCS, no separate index store - a throwaway local dev
# instance, not a production deployment. Adapted from Loki's own documented
# single-binary quickstart config.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: ../data/loki
  storage:
    filesystem:
      chunks_directory: ../data/loki/chunks
      rules_directory: ../data/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  allow_structured_metadata: true
