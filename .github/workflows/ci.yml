name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Aftermath.slnx

      - name: Build
        run: dotnet build src/Aftermath.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Aftermath.Tests/Aftermath.Tests.csproj --no-build --configuration Release
